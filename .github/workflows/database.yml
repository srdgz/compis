name: Database

on:
  workflow_dispatch:
    inputs:
      reset_demo:
        description: Recreate the demo accounts after migrating
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - backend/migrations/**
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate and refresh demo data
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET_KEY: migration-only-this-value-is-never-used-by-the-app
    steps:
      - name: Check the database secret
        id: gate
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL is not set in the production environment, skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: steps.gate.outputs.configured == 'true'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.configured == 'true'
        run: flask --app compis.bootstrap:create_app db upgrade
      - if: steps.gate.outputs.configured == 'true' && (github.event_name == 'schedule' || inputs.reset_demo)
        run: flask --app compis.bootstrap:create_app reset-demo
