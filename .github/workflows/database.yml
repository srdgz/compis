name: Database

on:
  workflow_dispatch:
    inputs:
      reset_demo:
        description: Recreate the demo accounts after migrating
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - backend/migrations/**
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate and refresh demo data
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET_KEY: migration-only-this-value-is-never-used-by-the-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: flask --app compis.bootstrap:create_app db upgrade
      - if: github.event_name == 'schedule' || inputs.reset_demo
        run: flask --app compis.bootstrap:create_app reset-demo
